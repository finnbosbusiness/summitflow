<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Rejection Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0a0f;--card:#13131a;--card2:#1c1c26;--bd:#2a2a3a;--bd2:#1f1f2e;
  --a:#6366f1;--ah:#4f46e5;--al:rgba(99,102,241,.12);--am:#818cf8;--abd:rgba(99,102,241,.35);
  --txt:#f1f5f9;--t2:#cbd5e1;--t3:#64748b;--t4:#334155;
  --grn:#10b981;--gnl:rgba(16,185,129,.12);
  --org:#f97316;--red:#ef4444;--gld:#f59e0b;
  --fn:'Outfit',sans-serif;--r:14px;--rl:18px;
}
html,body{height:100%;overscroll-behavior:none;}
body{background:var(--bg);color:var(--txt);font-family:var(--fn);-webkit-font-smoothing:antialiased;overflow:hidden;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes particle{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-65px)}}
@keyframes heatPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0),0 6px 32px rgba(99,102,241,.3)}50%{box-shadow:0 0 28px 8px rgba(239,68,68,.45),0 6px 32px rgba(239,68,68,.2)}}
@keyframes lvlIn{0%{opacity:0;transform:scale(.5) translateY(30px)}65%{transform:scale(1.1) translateY(-4px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes bossIn{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-300% center}100%{background-position:300% center}}
@keyframes tIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes msgAnim{0%{opacity:0;transform:translateY(-3px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0}}
@keyframes numPop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes screenShake{0%,100%{transform:translate(0,0)}10%{transform:translate(-6px,3px)}20%{transform:translate(6px,-3px)}30%{transform:translate(-5px,5px)}40%{transform:translate(5px,-4px)}50%{transform:translate(-4px,3px)}60%{transform:translate(4px,-2px)}70%{transform:translate(-3px,2px)}80%{transform:translate(3px,-1px)}90%{transform:translate(-1px,1px)}}
@keyframes critIn{0%{opacity:0;transform:scale(.3) rotate(-8deg)}50%{transform:scale(1.15) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}
@keyframes nearMissPulse{0%,100%{opacity:.7}50%{opacity:1;text-shadow:0 0 12px rgba(249,115,22,.6)}}
@keyframes dangerPulse{0%,100%{border-color:rgba(239,68,68,.3)}50%{border-color:rgba(239,68,68,.8);box-shadow:0 0 16px rgba(239,68,68,.2);}}

.layout{display:flex;height:100dvh;overflow:hidden;}
.sidebar{width:196px;flex-shrink:0;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100dvh;overflow-y:auto;}
.main-area{flex:1;height:100dvh;overflow-y:auto;}
.right-col{width:256px;flex-shrink:0;background:var(--card);border-left:1px solid var(--bd);height:100dvh;overflow-y:auto;}
.nv{display:flex;align-items:center;gap:.5rem;padding:.48rem .75rem;border-radius:9px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--t3);transition:all .12s;margin:.06rem .45rem;}
.nv:hover{background:var(--al);color:var(--am);}
.nv.on{background:var(--al);color:var(--am);}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);}
.card2{background:var(--card2);border:1px solid var(--bd2);border-radius:var(--r);}
.lbl{font-size:.57rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--t3);}
.btn{border:none;cursor:pointer;font-family:var(--fn);font-weight:700;transition:all .1s;border-radius:var(--r);}
.btn:active{transform:scale(.96);}

#overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(10,10,15,.97);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
#overlay.show{display:flex;animation:fadeIn .25s ease;}
#toast-tray{position:fixed;top:1rem;right:1rem;display:flex;flex-direction:column;gap:7px;z-index:900;pointer-events:none;}
.toast{background:var(--card2);border:1px solid var(--abd);border-radius:14px;padding:.7rem .95rem;display:flex;align-items:center;gap:.65rem;animation:tIn .35s cubic-bezier(.34,1.3,.64,1);max-width:252px;}
.toast-icon{width:32px;height:32px;border-radius:50%;background:var(--al);border:1.5px solid var(--abd);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.toast-name{font-weight:700;font-size:.78rem;color:var(--am);}
.toast-desc{font-size:.68rem;color:var(--t3);margin-top:.08rem;}

#pt-stage{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden;}
.pt{position:absolute;border-radius:50%;animation:particle .65s ease-out forwards;pointer-events:none;}
.flt{position:fixed;pointer-events:none;z-index:550;font-weight:900;animation:floatUp .65s ease-out forwards;font-family:var(--fn);}

#combo-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:600;pointer-events:none;display:none;text-align:center;}
#combo-num{font-size:clamp(4rem,14vw,8rem);font-weight:900;line-height:1;letter-spacing:-4px;}
#combo-sub{font-size:.82rem;font-weight:800;letter-spacing:5px;text-transform:uppercase;margin-top:.15rem;opacity:.65;}

#sprint-panel{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:rgba(10,10,15,.95);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:20px;padding:.85rem 1.35rem;display:none;align-items:center;gap:1rem;z-index:400;min-width:255px;}
#sprint-panel.show{display:flex;}
.sp-count{font-size:1.85rem;font-weight:900;color:var(--txt);line-height:1;}
.sp-lbl{font-size:.58rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-top:.1rem;}
.sp-pace{font-size:.72rem;color:var(--t3);margin-top:.22rem;}
#sprint-end{background:none;border:1px solid var(--bd);color:var(--t3);font-family:var(--fn);font-size:.68rem;padding:.32rem .65rem;border-radius:8px;cursor:pointer;margin-left:auto;}

#log-btn{width:100%;padding:1.35rem;font-size:1.05rem;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,var(--a),var(--ah));color:#fff;border:none;border-radius:18px;cursor:pointer;font-family:var(--fn);box-shadow:0 6px 32px rgba(99,102,241,.35);transition:transform .08s,box-shadow .15s,background .25s;position:relative;overflow:hidden;user-select:none;}
#log-btn:active{transform:scale(.95);}
#log-btn.hot-1{background:linear-gradient(135deg,#f97316,#ef4444);box-shadow:0 6px 32px rgba(249,115,22,.4);}
#log-btn.hot-2{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 6px 32px rgba(239,68,68,.5);animation:heatPulse 1.1s ease infinite;}
#log-btn.hot-3{background:linear-gradient(135deg,#dc2626,#7f1d1d);box-shadow:0 0 40px 8px rgba(239,68,68,.55);animation:heatPulse .65s ease infinite;}

#cbar-wrap{height:3px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin-top:.45rem;opacity:0;transition:opacity .2s;}
#cbar-wrap.show{opacity:1;}
#cbar{height:100%;width:0%;background:linear-gradient(90deg,#f97316,#ef4444);border-radius:999px;transition:width .08s linear;}

.ring-svg{transform:rotate(-90deg);}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{font-size:.53rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t4);text-align:center;padding:.28rem 0;}
.cal-day{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border:1px solid transparent;transition:transform .1s;}
.cal-day .dn{font-size:.76rem;font-weight:700;line-height:1;}
.cal-day .dc{font-size:.46rem;font-weight:700;margin-top:1px;}
.cal-day.empty{cursor:default;}
.cal-day.future{opacity:.22;cursor:default;}
.cal-day.none{background:var(--bd2);}.cal-day.none .dn{color:var(--t4);}
.cal-day.some{background:var(--al);border-color:var(--abd);}.cal-day.some .dn{color:var(--am);}.cal-day.some .dc{color:var(--am);}
.cal-day.full{background:linear-gradient(135deg,var(--a),var(--am));box-shadow:0 2px 8px rgba(99,102,241,.35);}.cal-day.full .dn,.cal-day.full .dc{color:#fff;}
.cal-day.today{border-color:var(--am)!important;}
.cal-day:not(.empty):not(.future):hover{transform:scale(1.09);z-index:1;}

#cal-screen{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2rem 1rem 6rem;overflow-y:auto;animation:fadeIn .3s ease;}
.cal-wrap{width:100%;max-width:420px;}

@media(max-width:840px){.sidebar,.right-col{display:none;}.desktop-only{display:none!important;}.main-area{height:auto;}.layout{flex-direction:column;}}
@media(min-width:841px){.mobile-only{display:none!important;}}
</style>
</head>
<body>

<div id="pt-stage"></div>
<div id="combo-wrap"><div id="combo-num"></div><div id="combo-sub">COMBO</div></div>
<div id="toast-tray"></div>

<!-- CRITICAL HIT OVERLAY -->
<div id="crit-overlay" style="display:none;position:fixed;inset:0;z-index:700;pointer-events:none;display:none;align-items:center;justify-content:center;">
  <div id="crit-inner" style="text-align:center;">
    <div id="crit-label" style="font-size:clamp(3rem,14vw,6rem);font-weight:900;letter-spacing:-3px;line-height:1;"></div>
    <div id="crit-sub" style="font-size:.9rem;font-weight:800;letter-spacing:4px;text-transform:uppercase;opacity:.7;margin-top:.3rem;"></div>
  </div>
</div>

<div id="sprint-panel">
  <svg width="44" height="44" viewBox="0 0 44 44" style="transform:rotate(-90deg);flex-shrink:0;">
    <circle cx="22" cy="22" r="18" fill="none" stroke="var(--bd)" stroke-width="3.5"/>
    <circle id="sp-arc" cx="22" cy="22" r="18" fill="none" stroke="#f97316" stroke-width="3.5"
      stroke-dasharray="113" stroke-dashoffset="0" stroke-linecap="round" style="transition:stroke-dashoffset .5s linear;"/>
  </svg>
  <div>
    <div class="sp-count"><span id="sp-nos">0</span> NOs</div>
    <div class="sp-lbl"><span id="sp-timer">10:00</span> left</div>
    <div class="sp-pace" id="sp-pace">Start dialling</div>
  </div>
  <button id="sprint-end" onclick="endSprint()">End</button>
</div>

<div id="overlay"></div>

<!-- CALENDAR ENTRY -->
<div id="cal-screen">
  <div class="cal-wrap">
    <div style="text-align:center;margin-bottom:1.6rem;">
      <div style="font-size:clamp(1.7rem,5vw,2.3rem);font-weight:900;letter-spacing:-.5px;margin-bottom:.25rem;">The Rejection Game</div>
      <div style="font-size:.8rem;color:var(--t3);">Your cold call record</div>
    </div>
    <div id="streak-banner" style="border-radius:16px;padding:1rem 1.3rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.15rem;color:#fff;">
      <div>
        <div id="streak-num" style="font-size:2.7rem;font-weight:900;line-height:1;">0</div>
        <div style="font-size:.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.7;margin-top:.1rem;">Day Streak</div>
      </div>
      <div id="streak-msg" style="font-size:.78rem;font-weight:600;max-width:190px;line-height:1.5;opacity:.9;text-align:right;"></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;">
      <button id="prev-m" style="width:29px;height:29px;border:1px solid var(--bd);border-radius:7px;background:var(--card);cursor:pointer;color:var(--t2);font-size:.85rem;display:flex;align-items:center;justify-content:center;">‹</button>
      <div id="month-lbl" style="font-weight:800;font-size:.95rem;"></div>
      <button id="next-m" style="width:29px;height:29px;border:1px solid var(--bd);border-radius:7px;background:var(--card);cursor:pointer;color:var(--t2);font-size:.85rem;display:flex;align-items:center;justify-content:center;">›</button>
    </div>
    <div class="cal-grid" id="cal-grid-entry"></div>
    <div id="no-call-warn" style="display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:.75rem 1rem;margin-top:.8rem;font-size:.78rem;color:var(--red);font-weight:600;">⚠️ No calls logged today. Don't break the streak.</div>
    <button id="enter-btn" style="width:100%;padding:1.05rem;background:linear-gradient(135deg,var(--a),var(--ah));color:#fff;border:none;border-radius:14px;font-family:var(--fn);font-weight:800;font-size:.97rem;letter-spacing:.5px;cursor:pointer;margin-top:1.3rem;box-shadow:0 4px 20px rgba(99,102,241,.35);">
      Enter the Game →
    </button>
  </div>
</div>

<!-- MAIN APP -->
<div class="layout" id="app" style="display:none;">
  <aside class="sidebar">
    <div style="padding:1.3rem 1rem .9rem;">
      <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1.4rem;">
        <div style="width:26px;height:26px;background:linear-gradient(135deg,var(--a),var(--ah));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900;color:#fff;">R</div>
        <div style="font-weight:800;font-size:.8rem;color:var(--txt);">Rejection<span style="color:var(--am);"> Game</span></div>
      </div>
      <div class="nv on" data-tab="game" onclick="setTab('game')">🎯 <span>Game</span></div>
      <div class="nv" data-tab="levels" onclick="setTab('levels')">⚔️ <span>Levels</span></div>
      <div class="nv" data-tab="bosses" onclick="setTab('bosses')">👹 <span>Bosses</span></div>
      <div class="nv" data-tab="achievements" onclick="setTab('achievements')">🏆 <span>Awards</span></div>
      <div class="nv" data-tab="calendar" onclick="setTab('calendar')">📅 <span>Calendar</span></div>
      <div class="nv" data-tab="stats" onclick="setTab('stats')">📊 <span>Stats</span></div>
    </div>
    <div style="flex:1;"></div>
    <div style="padding:.9rem 1rem;border-top:1px solid var(--bd2);" id="sb-level">
      <div style="background:var(--al);border:1px solid var(--abd);border-radius:10px;padding:.65rem .8rem;">
        <div class="lbl" style="margin-bottom:.28rem;">Level</div>
        <div style="display:flex;align-items:baseline;gap:.28rem;">
          <span id="sb-lv-n" style="font-size:1.4rem;font-weight:900;color:var(--am);">1</span>
          <span id="sb-lv-t" style="font-size:.72rem;font-weight:700;color:var(--am);">Prospect</span>
        </div>
        <div style="margin-top:.38rem;height:2px;background:var(--bd);border-radius:999px;overflow:hidden;">
          <div id="sb-xpbar" style="height:100%;width:0%;background:var(--a);border-radius:999px;transition:width .5s ease;"></div>
        </div>
        <div class="lbl" id="sb-xptxt" style="margin-top:.22rem;">0 / 2 XP</div>
      </div>
    </div>
    <div style="padding:0 1rem 1rem;display:flex;flex-direction:column;gap:.3rem;">
      <button onclick="goToCalendar()" style="width:100%;padding:.42rem;background:var(--al);border:1px solid var(--abd);border-radius:7px;font-family:var(--fn);font-size:.68rem;color:var(--am);cursor:pointer;font-weight:700;">← Back</button>
      <button onclick="if(confirm('Reset all data?')){localStorage.removeItem('rg3');location.reload();}" style="width:100%;padding:.42rem;background:none;border:1px solid var(--bd);border-radius:7px;font-family:var(--fn);font-size:.68rem;color:var(--t4);cursor:pointer;">Reset</button>
    </div>
  </aside>

  <div class="main-area">
    <div id="main-content" style="padding:1.4rem;max-width:700px;margin:0 auto;"></div>
    <div class="mobile-only" style="height:66px;"></div>
  </div>

  <aside class="right-col desktop-only" id="right-col" style="padding:1.3rem 1rem;display:flex;flex-direction:column;gap:.9rem;overflow-y:auto;"></aside>

  <nav class="mobile-only" style="position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:50;">
    <button onclick="setTab('game')" data-mt="game" style="flex:1;border:none;background:none;cursor:pointer;padding:.5rem 0 .6rem;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:1;"><span style="font-size:1rem;">🎯</span><span style="font-size:.42rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt);">Game</span></button>
    <button onclick="setTab('levels')" data-mt="levels" style="flex:1;border:none;background:none;cursor:pointer;padding:.5rem 0 .6rem;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.35;"><span style="font-size:1rem;">⚔️</span><span style="font-size:.42rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt);">Levels</span></button>
    <button onclick="setTab('bosses')" data-mt="bosses" style="flex:1;border:none;background:none;cursor:pointer;padding:.5rem 0 .6rem;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.35;"><span style="font-size:1rem;">👹</span><span style="font-size:.42rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt);">Bosses</span></button>
    <button onclick="setTab('achievements')" data-mt="achievements" style="flex:1;border:none;background:none;cursor:pointer;padding:.5rem 0 .6rem;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.35;"><span style="font-size:1rem;">🏆</span><span style="font-size:.42rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt);">Awards</span></button>
    <button onclick="setTab('stats')" data-mt="stats" style="flex:1;border:none;background:none;cursor:pointer;padding:.5rem 0 .6rem;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.35;"><span style="font-size:1rem;">📊</span><span style="font-size:.42rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt);">Stats</span></button>
  </nav>
</div>

<script>
const TOTAL=3500,DAILY=100;
const TODAY=()=>new Date().toISOString().split("T")[0];
const YDAY=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().split("T")[0];};
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const TITLES=["Prospect","Caller","Dialler","Cold Caller","Operator","Pipeline Builder","Outreach Engine","Volume King","Deal Seeker","Closer","Revenue Chaser","Cold Blood","The Dialler","Rejection Proof","No Fear","Street Fighter","Battle Tested","Iron Mind","Unbreakable","Rainmaker","Storm Caller","Revenue Engine","The Grinder","Momentum Keeper","Pipeline Master","Ice Veins","High Pressure","Commission Hungry","First Blood","Territory Owner","Account Slayer","Cold Call Monk","The Machine","Appointment Assassin","Deal Hunter","Elite Closer","Sharp Shooter","The Operator","Untouchable","Relentless","Stone Cold","Revenue Ghost","Pipeline God","Black Belt","War Dialler","Savage Closer","Conviction King","No Days Off","The Finisher","Agency Builder","Capital Accumulator","Growth Engine","Business Animal","Wealth Creator","Six Figure","Compound Effect","Relentless II","No Excuses","The Obsessed","Zero To One","Unstoppable","Apex Predator","Cold Blood II","Executive Closer","Revenue Commander","The Architect","Empire Mode","Market Mover","Top One Percent","Monopoly","The Summit","Ascendant","Sovereign","Invincible","Market Dominator","Category King","The Authority","Legacy Builder","The Visionary","Elite Of Elite","The Reckoning","Force Of Nature","Eternal Grinder","Beyond Human","The Anomaly","Final Form","Otherworldly","Absolute","Transcendent","Ascension","The Mythic","Immortal Mindset","Living Legend","Beyond Limits","The Untold","Epoch Maker","History Maker","The Monument","Godmode","Legend"];
const LEVELS=Array.from({length:100},(_,i)=>({n:i+1,title:TITLES[i],xp:i*i*2}));

const BOSSES=[
  {id:1,name:"The Gatekeeper",target:500,tagline:"Get past the resistance",
   portrait:"🚪",color:"#6366f1",
   lore:"Every new thing you try, it's there. The voice that says the timing isn't right. That you need more prep. That you'll start tomorrow. The Gatekeeper isn't a person — it's the friction between intention and action. It lives in the two seconds before you dial.",
   reward:"Unlock: Dialler title + Call streak protection (1 grace day)"},
  {id:2,name:"The Doubter",target:1000,tagline:"Silence the inner critic",
   portrait:"🪞",color:"#8b5cf6",
   lore:"1,000 rejections in and The Doubter gets loud. It replays every bad call. It compares you to people who 'got lucky'. It points out that your script isn't perfect, your niche isn't right, your offer needs work. It's fluent in your exact insecurities.",
   reward:"Unlock: Cold Blood title + XP multiplier ×1.2"},
  {id:3,name:"The Comfort Zone",target:1500,tagline:"Break what's familiar",
   portrait:"🛋️",color:"#f59e0b",
   lore:"You've found a rhythm. A script that doesn't embarrass you. Hours that feel okay. The Comfort Zone isn't painful — that's the trap. It's warm. It's predictable. It will keep you exactly where you are forever if you let it.",
   reward:"Unlock: Ice Veins title + Sprint unlock"},
  {id:4,name:"The Quitter",target:2000,tagline:"When most give up",
   portrait:"🚪",color:"#ef4444",

function getLvl(xp){
  let cur=LEVELS[0],nxt=LEVELS[1];
  for(let i=LEVELS.length-1;i>=0;i--){if(xp>=LEVELS[i].xp){cur=LEVELS[i];nxt=LEVELS[i+1]??null;break;}}
  const into=xp-cur.xp,need=nxt?nxt.xp-cur.xp:1;
  return{cur,nxt,into,need,pct:Math.min((into/need)*100,100)};
}

}

const CRIT_COLORS=["#f59e0b","#10b981","#a855f7","#f97316","#6366f1","#ef4444","#06b6d4"];

let lastCritTime=0;
function rollCrit(){
  // Variable ratio: base 8%, higher on combo streaks, can't fire twice in 3s
  const now=Date.now();
  if(now-lastCritTime<3000)return false;
  const baseChance=0.08;
  const comboBonus=Math.min(combo*0.004,0.12); // up to +12% at combo 30
  return Math.random()<(baseChance+comboBonus);
}

function fireCrit(x,y){
  lastCritTime=Date.now();
  const msg=CRIT_MSGS[Math.floor(Math.random()*CRIT_MSGS.length)];
  const clr=CRIT_COLORS[Math.floor(Math.random()*CRIT_COLORS.length)];

  // Extra XP
  ST.xp+=msg.xp;
  ST.totalCrits=(ST.totalCrits||0)+1;

  // Big particle burst
  particles(x,y,28);

  // Screen shake
  shakeScreen();

  // Critical sound
  playCrit();

  // Show crit overlay
  const ov=document.getElementById("crit-overlay");
  const lbl=document.getElementById("crit-label");
  const sub=document.getElementById("crit-sub");
  if(ov&&lbl&&sub){
    lbl.textContent=msg.label;
    lbl.style.color=clr;
    sub.textContent=msg.sub+" · +" + msg.xp + " XP";
    sub.style.color=clr;
    ov.style.display="flex";
    ov.style.animation="none";
    const inner=document.getElementById("crit-inner");
    if(inner){inner.style.animation="none";setTimeout(()=>{inner.style.animation="critIn .4s cubic-bezier(.34,1.4,.64,1) forwards";},10);}
    ov.style.background=`radial-gradient(circle at center, ${clr}18 0%, transparent 70%)`;
    clearTimeout(ov._h);
    ov._h=setTimeout(()=>{ov.style.display="none";},1200);
  }

  // Toast
  setTimeout(()=>showToast({icon:"⚡",name:msg.label,desc:`+${msg.xp} bonus XP`}),200);
}

function playCrit(){
  try{
    const ac=getAC();
    [0,.04,.1,.2].forEach((d,i)=>{
      const t=ac.currentTime+d,o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.type="sine";
      const f=[523,659,784,1047][i];
      o.frequency.setValueAtTime(f,t);
      o.frequency.exponentialRampToValueAtTime(f*1.2,t+.12);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.2);
      o.start(t);o.stop(t+.22);
    });
  }catch(e){}
}

function getNextMilestone(n){
  // Milestone targets: boss checkpoints, round hundreds, achievements
  const targets=[
    // Boss targets
    ...BOSSES.map(b=>({val:b.target,label:`Boss: ${b.name}`})),
    // Round numbers
    ...[50,100,150,200,250,300,400,500,750,1000,1250,1500,1750,2000,2500,3000,3500].map(v=>({val:v,label:`${v} NOs`})),
    // Today milestones
    {val:ST.nos+(DAILY-(ST.nosToday||0)),label:"Today's target",today:true},
    // Next ach
    ...ACHS.filter(a=>!ST.unlockedAchs.includes(a.id)&&typeof a.check({...ST,nos:n+500})!=="undefined").slice(0,2).map(a=>{
      // Approximate NOs needed
      const needed=a.id.startsWith("n")?parseInt(a.id.slice(1).replace("k","000")||"0"):null;
      return needed&&needed>n?{val:needed,label:a.name}:null;
    }).filter(Boolean),
  ].filter(m=>m&&m.val>n).sort((a,b)=>a.val-b.val);
  return targets[0]||null;
}

function getProximityMsg(n,nt){
  const next=getNextMilestone(n);
  if(!next)return null;
  const diff=next.val-n;
  if(diff<=1)return`🔥 1 NO away from ${next.label}`;
  if(diff<=3)return`⚡ ${diff} NOs from ${next.label}`;
  if(diff<=10)return`${diff} away — ${next.label}`;
  if(diff<=25)return`${diff} NOs to ${next.label}`;
  // Today target urgency
  const toDaily=DAILY-(nt||0);
  if(toDaily>0&&toDaily<=20)return`${toDaily} NOs to hit today's target`;
  return null;
}

function logNo(mult=1,isCrit=false){
  const today=TODAY(),oldXp=ST.xp,oldNos=ST.nos;
  if(ST.lastDayKey!==today){ST.nosToday=0;ST.lastDayKey=today;}
  ST.nosToday++;ST.nos++;ST.xp+=mult;
  if(!ST.dailyCalls)ST.dailyCalls={};
  ST.dailyCalls[today]=(ST.dailyCalls[today]||0)+1;
  if(ST.nosToday===DAILY){
    const y=YDAY();
    ST.streak=ST.lastStreakDay===y?ST.streak+1:1;
    ST.bestStreak=Math.max(ST.bestStreak,ST.streak);
    ST.lastStreakDay=today;
    playMilestone();
  }
  chkAchs();chkLvl(oldXp,ST.xp);chkBoss(oldNos,ST.nos);
  if(ST.nos>=TOTAL)setTimeout(()=>showMissionComplete(),1500);
  save();

  // Proximity msg takes priority over random msg
  const proxMsg=getProximityMsg(ST.nos,ST.nosToday);
  flashMsg=proxMsg||(isCrit?null:NO_MSGS[Math.floor(Math.random()*NO_MSGS.length)]);
  clearTimeout(flashTo);
  flashTo=setTimeout(()=>{flashMsg=null;renderMain();},proxMsg?3000:2000);

}

  if(pace){const el=600-sprintLeft;if(el>20){const r=sprintNos/(el/60);pace.textContent=`~${Math.round(r*10)} projected`;}else pace.textContent="Start dialling";}
}

// TABS
let calDate=new Date();
function setTab(tab){
  currentTab=tab;

function renderCalendar(){
  const year=calDate.getFullYear(),month=calDate.getMonth();
  const ml=new Date(year,month,1).toLocaleString("en-GB",{month:"long",year:"numeric"});
  const dows=["M","T","W","T","F","S","S"];
  const first=new Date(year,month,1),sdow=(first.getDay()+6)%7,dim=new Date(year,month+1,0).getDate(),ts=TODAY();
  let cells=dows.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  let mTotal=0,mDays=0;
  for(let i=0;i<sdow;i++)cells+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const isT=ds===ts,isF=ds>ts,calls=ST.dailyCalls?.[ds]||0,cc=ds===ts?Math.max(calls,ST.nosToday||0):calls;
    if(cc>0){mTotal+=cc;mDays++;}
    let cls="cal-day"+(isF?" future":cc>=DAILY?" full":cc>0?" some":" none")+(isT?" today":"");
    cells+=`<div class="${cls}"><div class="dn">${d}</div>${cc>0?`<div class="dc">${cc}</div>`:""}</div>`;
  }
  return`<div style="display:flex;flex-direction:column;gap:.9rem;animation:fadeIn .3s ease;max-width:420px;">
    <div style="font-size:1.35rem;font-weight:800;">Call Calendar</div>

      <div class="card" style="padding:.85rem;"><div class="lbl" style="margin-bottom:.28rem;">This Month</div><div style="font-size:1.65rem;font-weight:900;color:var(--am);line-height:1;">${mTotal.toLocaleString()}</div><div style="font-size:.65rem;color:var(--t3);margin-top:.12rem;">calls logged</div></div>
      <div class="card" style="padding:.85rem;"><div class="lbl" style="margin-bottom:.28rem;">Days Active</div><div style="font-size:1.65rem;font-weight:900;color:var(--grn);line-height:1;">${mDays}</div><div style="font-size:.65rem;color:var(--t3);margin-top:.12rem;">of ${dim} days</div></div>
    </div>
    <div class="card" style="padding:1.05rem;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;">
        <div style="font-weight:800;font-size:.92rem;">${ml}</div>
        <div style="display:flex;gap:.3rem;">
          <button onclick="calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderMain()" style="width:27px;height:27px;border:1px solid var(--bd);border-radius:6px;background:var(--card2);cursor:pointer;color:var(--t2);font-size:.8rem;">‹</button>
          <button onclick="calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderMain()" style="width:27px;height:27px;border:1px solid var(--bd);border-radius:6px;background:var(--card2);cursor:pointer;color:var(--t2);font-size:.8rem;">›</button>
        </div>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div style="display:flex;gap:.55rem;flex-wrap:wrap;">

let selectedLevel=null;

function renderLevels(){
  const lv=getLvl(ST.xp);
  const cur=lv.cur.n;
  if(selectedLevel===null) selectedLevel=cur;
  const sel=LEVELS[selectedLevel-1];
  const isUnlocked=cur>=selectedLevel;
  const isCurrent=cur===selectedLevel;

  // Tier bands for visual colour
  function tierColor(n){
    if(n>=90)return"#f59e0b";
    if(n>=70)return"#a855f7";

    if(n>=30)return"#f97316";
    if(n>=15)return"#6366f1";
    return"var(--t3)";
  }
  function tierLabel(n){
    if(n>=90)return"Mythic";
    if(n>=70)return"Legendary";
    if(n>=50)return"Elite";
    if(n>=30)return"Advanced";
    if(n>=15)return"Intermediate";
    return"Rookie";
  }

  const xpNeeded=sel.xp;
  const prevXp=selectedLevel>1?LEVELS[selectedLevel-2].xp:0;
  const rangeXp=xpNeeded-prevXp;

  return`<div style="display:flex;flex-direction:column;gap:1rem;animation:fadeIn .3s ease;">

      ${isUnlocked?`<div style="position:absolute;inset:0;background:radial-gradient(circle at top right,${tierColor(selectedLevel)}0a 0%,transparent 60%);pointer-events:none;"></div>`:""}
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;">
        <div>
          <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;">
            <div style="font-size:2.2rem;font-weight:900;color:${isUnlocked?tierColor(selectedLevel):"var(--t4)"};line-height:1;">${selectedLevel}</div>
            <div>
              <div style="font-size:.55rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:${isUnlocked?tierColor(selectedLevel):"var(--t4)"};">${tierLabel(selectedLevel)}</div>

        </div>

          ${isCurrent?`<div style="background:var(--al);border:1px solid var(--abd);border-radius:8px;padding:.35rem .65rem;font-size:.62rem;font-weight:700;color:var(--am);">CURRENT</div>`:""}
          ${isUnlocked&&!isCurrent?`<div style="background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:.35rem .65rem;font-size:.62rem;font-weight:700;color:#10b981;">UNLOCKED</div>`:""}

      </div>

  </div>`;

function getLevelFlavour(n){
  const flavours={
    1:"Where every journey starts. You picked up the phone.",
    5:"You know the script. Now it's about reps.",
    10:"Double digits. The habit is forming.",
    15:"You've survived the first wave of self-doubt.",
    20:"Most people quit before this. You didn't.",
    25:"A quarter of the way through the title ladder.",
    30:"Your voice is different now. More certain.",
    35:"You've heard every objection at least twice.",
    40:"The game is starting to feel like yours.",
    50:"Halfway through the levels. Elite territory begins.",
    60:"You're operating at a level most won't reach.",
    70:"Legendary. This is the top tier of the game.",
    80:"Beyond what most people model their success on.",
    90:"Mythic. Three digits away from the summit.",
    100:"Legend. The final form. Nothing left to prove.",
  };
  // Find closest flavour
  const keys=Object.keys(flavours).map(Number).sort((a,b)=>a-b);
  let best=keys[0];
  for(const k of keys){if(k<=n)best=k;}
  return flavours[best];
}

function bindLevelClicks(){
  document.querySelectorAll(".lvl-cell").forEach(el=>{
    el.addEventListener("click",()=>{
      selectedLevel=parseInt(el.dataset.lvn);
      renderMain();
    });
  });
}

// ACHIEVEMENTS TAB (rebuilt)
// ═══════════════════════════════════════
function renderAchievements(){
  const cats=[
    {id:"volume", label:"Volume", icon:"📞"},
    {id:"streak", label:"Streak", icon:"🔥"},
    {id:"daily",  label:"Daily",  icon:"💥"},
    {id:"combo",  label:"Combo",  icon:"⚡"},
    {id:"crit",   label:"Crits",  icon:"🎰"},
  ];
  const done=ST.unlockedAchs.length;

  function achProgress(a){
    // Return [current, target] for progress bar on locked achievements
    if(a.id.startsWith("n")){const t=parseInt(a.id.slice(1).replace("k","000"));return[Math.min(ST.nos,t),t];}
    if(a.id.startsWith("s")){const t=parseInt(a.id.slice(1));return[Math.min(ST.streak,t),t];}
    if(a.id.startsWith("d")){const t=parseInt(a.id.slice(1));return[Math.min(ST.nosToday||0,t),t];}
    if(a.id.startsWith("c")&&!a.id.startsWith("crit")){const t=parseInt(a.id.slice(1));return[Math.min(ST.bestCombo||0,t),t];}
    if(a.id.startsWith("crit")){const t=parseInt(a.id.slice(4));return[Math.min(ST.totalCrits||0,t),t];}
    return[0,1];
  }

  return`<div style="display:flex;flex-direction:column;gap:1rem;animation:fadeIn .3s ease;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:1.35rem;font-weight:800;">Achievements</div>
      <div style="font-size:.72rem;color:var(--t3);">${done} / ${ACHS.length} unlocked</div>
    </div>

    <!-- Overall progress bar -->
    <div class="card" style="padding:1rem;">
      <div style="display:flex;align-items:center;gap:1rem;">
        ${ringHTML(done,ACHS.length,56,5,"var(--gld)")}
        <div>
          <div style="font-size:1.4rem;font-weight:900;color:var(--gld);line-height:1;">${Math.round((done/ACHS.length)*100)}%</div>
          <div style="font-size:.7rem;color:var(--t3);margin-top:.1rem;">${done} of ${ACHS.length} achievements</div>
          <div style="font-size:.68rem;color:var(--t4);margin-top:.08rem;">${ACHS.length-done} remaining</div>
        </div>
      </div>
    </div>

    <!-- Category sections -->
    ${cats.map(cat=>{
      const catAchs=ACHS.filter(a=>a.cat===cat.id);
      const catDone=catAchs.filter(a=>ST.unlockedAchs.includes(a.id)).length;
      return`<div class="card" style="padding:1rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem;">
          <div style="display:flex;align-items:center;gap:.5rem;">
            <span style="font-size:1rem;">${cat.icon}</span>
            <span style="font-size:.82rem;font-weight:800;color:var(--txt);">${cat.label}</span>
          </div>
          <div style="font-size:.65rem;color:var(--t3);">${catDone}/${catAchs.length}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:.5rem;">
          ${catAchs.map(a=>{
            const isDone=ST.unlockedAchs.includes(a.id);
            const [prog,tgt]=achProgress(a);
            const pct=Math.min((prog/tgt)*100,100);
            return`<div style="display:flex;align-items:center;gap:.75rem;padding:.75rem;background:${isDone?"var(--al)":"var(--bd2)"};border:1px solid ${isDone?"var(--abd)":"var(--bd)"};border-radius:11px;${isDone?"":"opacity:.75"}">
              <div style="width:38px;height:38px;border-radius:50%;background:${isDone?"var(--card2)":"var(--card)"};border:1.5px solid ${isDone?"var(--abd)":"var(--bd)"};display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;filter:${isDone?"none":"grayscale(1) opacity(.3)"};">${isDone?a.icon:"?"}</div>
              <div style="flex:1;min-width:0;">
                <div style="font-weight:700;font-size:.82rem;color:${isDone?"var(--am)":"var(--t2)"};">${isDone?a.name:"???"}</div>
                <div style="font-size:.68rem;color:var(--t3);margin-top:.08rem;">${isDone?a.desc:a.hint}</div>
                ${!isDone&&pct>0?`<div style="margin-top:.38rem;height:2px;background:var(--bd);border-radius:999px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:var(--a);border-radius:999px;"></div></div><div style="font-size:.58rem;color:var(--t4);margin-top:.18rem;">${prog} / ${tgt}</div>`:""}
              </div>
              ${isDone?`<div style="font-size:.75rem;color:var(--grn);flex-shrink:0;">✓</div>`:""}
            </div>`;
          }).join("")}
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

  document.getElementById("streak-msg").textContent=getStreakMsg(s);
  sb.style.background=s>0?"linear-gradient(135deg,#f97316,#ef4444)":"linear-gradient(135deg,var(--a),#6d28d9)";
  sb.style.boxShadow=s>0?"0 4px 20px rgba(239,68,68,.3)":"0 4px 20px rgba(99,102,241,.3)";
  const tc=ST.dailyCalls?.[TODAY()]||ST.nosToday||0;
  const w=document.getElementById("no-call-warn");if(w)w.style.display=(tc===0&&ST.nos>0)?"block":"none";
  renderEntryGrid();
}
function renderEntryGrid(){
  const grid=document.getElementById("cal-grid-entry"),lbl=document.getElementById("month-lbl");
  const year=entryCalDate.getFullYear(),month=entryCalDate.getMonth();
  lbl.textContent=new Date(year,month,1).toLocaleString("en-GB",{month:"long",year:"numeric"});
  const dows=["M","T","W","T","F","S","S"],first=new Date(year,month,1),sdow=(first.getDay()+6)%7,dim=new Date(year,month+1,0).getDate(),ts=TODAY();
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  for(let i=0;i<sdow;i++)html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const isT=ds===ts,isF=ds>ts,calls=ST.dailyCalls?.[ds]||0,cc=ds===ts?Math.max(calls,ST.nosToday||0):calls;
    const cls="cal-day"+(isF?" future":cc>=DAILY?" full":cc>0?" some":" none")+(isT?" today":"");
    html+=`<div class="${cls}"><div class="dn">${d}</div>${cc>0?`<div class="dc">${cc}</div>`:""}</div>`;
  }
  grid.innerHTML=html;
}
document.getElementById("prev-m").addEventListener("click",()=>{entryCalDate=new Date(entryCalDate.getFullYear(),entryCalDate.getMonth()-1,1);renderEntryGrid();});
document.getElementById("next-m").addEventListener("click",()=>{entryCalDate=new Date(entryCalDate.getFullYear(),entryCalDate.getMonth()+1,1);renderEntryGrid();});
document.getElementById("enter-btn").addEventListener("click",()=>{
  document.getElementById("cal-screen").style.display="none";
  document.getElementById("app").style.display="flex";
  renderMain();
});
function goToCalendar(){
  renderCalScreen();
  document.getElementById("app").style.display="none";
  const cs=document.getElementById("cal-screen");cs.style.display="flex";cs.style.animation="none";
  setTimeout(()=>cs.style.animation="fadeIn .3s ease",10);
}

renderCalScreen();
</script>
