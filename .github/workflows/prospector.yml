name: Prospect run

# Run by hand (Actions -> Run workflow) when the Call Queue is running low,
# one region at a time, so you only pay for leads you'll call.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region to run (blank = every town in England)"
        default: "West Midlands"
      only:
        description: "Only these towns, comma-separated (e.g. Birmingham,Solihull)"
        default: ""
      max_towns:
        description: "Only the first N towns (blank = all)"
        default: ""
      checks_only:
        description: "Don't search for new showrooms; only run the Meta and Google checks on rows already in the sheet"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (don't write to the sheet)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: prospector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          REGION: ${{ inputs.region }}
          ONLY: ${{ inputs.only }}
          MAX_TOWNS: ${{ inputs.max_towns }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHECKS_ONLY: ${{ inputs.checks_only }}
          PYTHONUNBUFFERED: "1"
        # Scraped data is never uploaded as a workflow artifact: this repo is
        # public, so artifacts would be downloadable by anyone.
        run: |
          args=()
          [ -n "$REGION" ] && args+=(--region "$REGION")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ -n "$MAX_TOWNS" ] && args+=(--max-towns "$MAX_TOWNS")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$CHECKS_ONLY" = "true" ] && args+=(--no-maps)
          python -m prospector.run "${args[@]}"
