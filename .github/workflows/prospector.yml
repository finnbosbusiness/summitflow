name: Prospect run

# Run by hand (Actions -> Run workflow). Finding showrooms uses the Google
# Places API; the Google search and Meta ad checks use Apify and are off
# unless "ad_checks" is ticked.
on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Which trade: kitchen (All Prospects tab) or roofing (Roofing Prospects tab)"
        type: choice
        options: [kitchen, roofing]
        default: kitchen
      region:
        description: "Region to run, or England for every town"
        default: "England"
      only:
        description: "Only these towns, comma-separated (e.g. Birmingham,Solihull)"
        default: ""
      max_towns:
        description: "Only the first N towns (blank = all)"
        default: ""
      ad_checks:
        description: "Also run the Google search and Meta ad checks (uses Apify credit)"
        type: boolean
        default: false
      checks_only:
        description: "Don't search for new showrooms; only run the Meta and Google checks on rows already in the sheet"
        type: boolean
        default: false
      find_decision_makers:
        description: "Only find decision makers (website, then Companies House number, then Facebook) for rows without one"
        type: boolean
        default: false
      facebook:
        description: "With find decision makers: also check Facebook pages (uses Apify credit)"
        type: boolean
        default: false
      max_rows:
        description: "With find decision makers: only the first N rows (blank = all)"
        default: ""
      dry_run:
        description: "Dry run (don't write to the sheet)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A whole-England run is mostly Companies House lookups, which are
    # rate-limited; GitHub stops jobs at 6 hours.
    timeout-minutes: 355
    defaults:
      run:
        working-directory: prospector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NICHE: ${{ inputs.niche }}
          REGION: ${{ inputs.region }}
          ONLY: ${{ inputs.only }}
          MAX_TOWNS: ${{ inputs.max_towns }}
          AD_CHECKS: ${{ inputs.ad_checks }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHECKS_ONLY: ${{ inputs.checks_only }}
          FIND_PEOPLE: ${{ inputs.find_decision_makers }}
          FACEBOOK: ${{ inputs.facebook }}
          MAX_ROWS: ${{ inputs.max_rows }}
          PYTHONUNBUFFERED: "1"
        # Scraped data is never uploaded as a workflow artifact: this repo is
        # public, so artifacts would be downloadable by anyone.
        run: |
          if [ "$FIND_PEOPLE" = "true" ]; then
            args=(--niche "${NICHE:-kitchen}")
            [ -n "$MAX_ROWS" ] && args+=(--limit "$MAX_ROWS")
            [ "$FACEBOOK" = "true" ] && args+=(--facebook)
            [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
            python -m prospector.people "${args[@]}"
            exit
          fi
          args=(--niche "${NICHE:-kitchen}")
          [ -n "$REGION" ] && args+=(--region "$REGION")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ -n "$MAX_TOWNS" ] && args+=(--max-towns "$MAX_TOWNS")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$CHECKS_ONLY" = "true" ] && args+=(--no-maps)
          [ "$AD_CHECKS" = "true" ] || [ "$CHECKS_ONLY" = "true" ] || args+=(--skip-google --skip-meta)
          python -m prospector.run "${args[@]}"
